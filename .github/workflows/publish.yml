name: Publish to crates.io

on:
  release:
    types: [published]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish workspace crates in topological order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish"
            exit 0
          fi
          for crate in xtce-pus xtce-model xtce-decode xtce-codegen xtce-cli; do
            echo "=== Publishing $crate ==="
            if output=$(cargo publish -p "$crate" 2>&1); then
              echo "$output"
              sleep 10
            else
              echo "$output"
              if echo "$output" | grep -qiE "already exists|already uploaded"; then
                echo "::notice::$crate is already published at this version; continuing"
              else
                exit 1
              fi
            fi
          done
