name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `stable`. Clippy gains lints with every release, so an unpinned
      # gate turns red for reasons unrelated to any change in this repository, and cannot be
      # reproduced locally without guessing which toolchain the runner picked up. New lints
      # are still surfaced, by the advisory job below.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # `-D warnings` is passed to clippy rather than set in RUSTFLAGS: as an environment
      # variable it would also apply to dependencies, so an unrelated crate emitting a
      # warning would fail this build for reasons nothing here can fix. Clippy is a rustc
      # driver, so this denies rustc's own lints as well as clippy's.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Differential tests against committed golden files
        run: cargo run -p xtask --release -- diff

  latest:
    name: latest stable (advisory)
    runs-on: ubuntu-latest
    # New lints are worth knowing about, but they are not this repository's fault and must
    # not block a merge on the day they ship.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    name: python bindings (advisory)
    runs-on: ubuntu-latest
    # Advisory for the same reason as the toolchain job: this needs a Python toolchain and a
    # network install of the reference implementation, neither of which is this repository's
    # to keep working. The three jobs above must stay green on their own.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2

      - name: Install build and test tools
        run: pip install maturin pytest space_packet_parser==6.1.2

      # `maturin develop` needs an activated virtualenv, which a runner does not have.
      # Building a wheel and installing it is what maturin itself suggests instead, and it
      # exercises the artefact a user would actually get.
      - name: Build the extension module
        run: maturin build --release --out dist --manifest-path crates/xtce-py/Cargo.toml

      - name: Install the wheel
        run: pip install --find-links dist --no-index xtce

      # Compares the bindings against the reference field by field, on four real files.
      - name: Differential tests through Python
        run: pytest crates/xtce-py/tests -q

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
