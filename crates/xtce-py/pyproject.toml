[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "xtce"
description = "Decode CCSDS telemetry packets against an XTCE definition"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Maciej Myszkiewicz" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/RustSpaceLab/xtce-rs"

[tool.maturin]
# The wheel is abi3, so one build works on CPython 3.10 and later.
features = ["pyo3/extension-module"]
